[project]
name = "ayvid"
version = "0.1.0"
description = "AYVID - Asymmetric Yield Via Intelligent Decisions"
authors = [{ name = "LEOATIS" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- Web / API ---
    # Upper bounds bumped 2026-05-02: pip 26.1's resolver hits
    # `resolution-too-deep` when the installable openbb-core / openbb
    # demands fastapi / starlette / openai versions outside our caps.
    # Matching the bounds to what the local venv + openbb-core 1.6.x
    # actually require keeps the resolver shallow.
    "fastapi[all]>=0.115,<0.130",
    "uvicorn[standard]>=0.29,<0.50",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",

    # --- Broker & Numerics ---
    # ib_async ships breaking changes between minor versions; pin to 1.x.
    "ib_async>=1.0.0,<2.0",
    "numpy>=1.26,<3",
    # pandas 3.x is the current line; openbb 1.6 supports it.
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "polars>=0.20,<2",

    # --- Graph & Vector Stores ---
    # neo4j 4 → 5 changed transaction APIs; lock to 5.x.
    "neo4j>=5.0,<6",
    "qdrant-client>=1.8,<2",

    # --- LLM Orchestration ---
    # LangChain went 1.0 in late-2025 and openai shipped 2.0 around
    # the same time. Pinning to the 1.x / 2.x lines keeps pip 26.1's
    # resolver shallow — without these floors, it tries every
    # langchain-core 0.3.x against every openai 1.x.x looking for a
    # combo that satisfies openbb-core, then hits resolution-too-deep.
    "langgraph>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-core>=1.0,<2",
    "openai>=2,<3",
    "anthropic>=0.30,<2",

    # --- Data Sources ---
    "openbb>=4.7.0,<5.0",

    # --- CLI & Terminal UI ---
    # typer 0.13+ rolled the legacy `[all]` extras (rich, shellingham,
    # colorama) into the base install. Plain `typer` is enough now and
    # avoids a "does not provide the extra 'all'" warning at install.
    "typer>=0.12,<1",
    "rich>=13.7,<16",

    # --- Async & Resilience ---
    "tenacity>=8.2,<10",
    "httpx>=0.27,<1",
    "aiofiles>=23,<26",
    "google-cloud-storage>=2.16,<4",

    # --- Skill loader (anthropic/financial-services integration) ---
    # Parses YAML frontmatter for .claude/skills/**/SKILL.md files.
    # Already pulled in transitively by langchain / openbb-core, but
    # pinning it explicitly so shared/skills_loader.py is supported.
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
feature-store = ["hopsworks", "hsfs"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
ayvid = "cli.app:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "shared*",
    "backend*",
    "data_primitives*",
    "graph_intelligence*",
    "execution_engine*",
    "backtesting*",
    "cli*",
]
exclude = [
    "frontend*",
    "infra*",
    "document*",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = [
    "E402",
    "E501",
    "E741",
    "N802",
    "N803",
    "N806",
    "N818",
    "UP042",
    "F841",
]
