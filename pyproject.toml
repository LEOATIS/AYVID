[project]
name = "ayvid"
version = "0.1.0"
description = "AYVID - Asymmetric Yield Via Intelligent Decisions"
authors = [{ name = "LEOATIS" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- Web / API ---
    "fastapi[all]>=0.110,<0.120",
    "uvicorn[standard]>=0.29,<0.40",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",

    # --- Broker & Numerics ---
    # ib_async ships breaking changes between minor versions; pin to 1.x.
    "ib_async>=1.0.0,<2.0",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "polars>=0.20,<2",

    # --- Graph & Vector Stores ---
    # neo4j 4 → 5 changed transaction APIs; lock to 5.x.
    "neo4j>=5.0,<6",
    "qdrant-client>=1.8,<2",

    # --- LLM Orchestration ---
    # LangChain ships breaking minor releases monthly. Pin tight enough
    # to make a release a deliberate decision, loose enough to absorb
    # security patches without a manual bump.
    "langgraph>=0.2,<0.3",
    "langchain-anthropic>=0.2,<0.3",
    "langchain-openai>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "openai>=1.30,<2",
    "anthropic>=0.30,<1",

    # --- Data Sources ---
    "openbb>=4.7.0,<5.0",

    # --- CLI & Terminal UI ---
    "typer[all]>=0.12,<1",
    "rich>=13.7,<15",

    # --- Async & Resilience ---
    "tenacity>=8.2,<10",
    "httpx>=0.27,<1",
    "aiofiles>=23,<25",
    "google-cloud-storage>=2.16,<4",
]

[project.optional-dependencies]
feature-store = ["hopsworks", "hsfs"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
ayvid = "cli.app:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "shared*",
    "backend*",
    "data_primitives*",
    "graph_intelligence*",
    "execution_engine*",
    "backtesting*",
    "cli*",
]
exclude = [
    "frontend*",
    "infra*",
    "document*",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = [
    "E402",
    "E501",
    "E741",
    "N802",
    "N803",
    "N806",
    "N818",
    "UP042",
    "F841",
]
