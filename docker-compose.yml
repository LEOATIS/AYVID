services:
  neo4j:
    image: neo4j:5-community
    container_name: ayvid-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  questdb:
    image: questdb/questdb:latest
    container_name: ayvid-questdb
    ports:
      - "9000:9000"
      - "9009:9009"
      - "8812:8812"
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/exec?query=select%201 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ayvid-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ayvid-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayvid-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      QUESTDB_HOST: questdb
      QUESTDB_PORT: 9009
      QDRANT_URL: http://qdrant:6333
    volumes:
      - live_data:/app/live
      - backtest_data:/app/document/backtests
    depends_on:
      neo4j: { condition: service_healthy }
      questdb: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ayvid-execution:
    build:
      context: .
      dockerfile: Dockerfile.execution
    container_name: ayvid-execution
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      QUESTDB_HOST: questdb
      QUESTDB_PORT: 9009
      AYVID_PAPER_MODE: ${AYVID_PAPER_MODE:-shadow}
    volumes:
      - live_data:/app/live
    depends_on:
      ayvid-api: { condition: service_healthy }
    restart: unless-stopped

  ayvid-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ayvid-frontend
    ports:
      - "3000:3000"
    environment:
      AYVID_API_BASE: http://ayvid-api:8000
    depends_on:
      ayvid-api: { condition: service_healthy }
    restart: unless-stopped

  ayvid-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayvid-pipeline
    command: ["python", "-m", "cli.app", "data", "pipeline"]
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      QUESTDB_HOST: questdb
      QUESTDB_PORT: 9009
    depends_on:
      neo4j: { condition: service_healthy }
      questdb: { condition: service_healthy }
    profiles:
      - pipeline

volumes:
  neo4j_data:
  questdb_data:
  qdrant_data:
  live_data:
  backtest_data:
