<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none"
     role="img" aria-label="AYVID">
  <!-- AYVID monogram — heavy Fraunces "A" + the gold full-stop.
       The period IS the brand: it reads as "the decision has been made."
       Single accent (#C9A84C); the rest is ink on paper.
       Self-importing the variable font so the SVG renders the right
       glyph in any context (inline, <img>, OG-bot, favicon-renderer). -->
  <defs>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,900&amp;display=block");
      .ay-mark {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-variation-settings: "opsz" 144, "SOFT" 30;
        letter-spacing: -0.045em;
        font-style: normal;
      }
    </style>
  </defs>
  <text x="60" y="92"
        class="ay-mark"
        font-size="108"
        fill="#F0E9DD"
        text-anchor="middle">A</text>
  <!-- Gold full-stop — the only #C9A84C anywhere in the system.
       Positioned at the baseline-right of the A. -->
  <circle cx="92" cy="88" r="8" fill="#C9A84C"/>
</svg>
