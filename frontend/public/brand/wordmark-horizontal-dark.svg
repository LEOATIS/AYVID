<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none"
     role="img" aria-label="AYVID">
  <!-- AYVID wordmark — heavy Fraunces with the gold full-stop.
       Tagline deliberately NOT included in this SVG.  At nav-scale
       (h=32px) the tagline truncated to "DECISI…" which read as a
       bug; the tagline now lives elsewhere (Hero acronym band, OG
       image, gate hero) and the wordmark stays the wordmark.
       Single accent: the gold period. -->
  <defs>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,900&amp;display=block");
      .ay-word {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-variation-settings: "opsz" 144, "SOFT" 30;
        letter-spacing: -0.04em;
      }
    </style>
  </defs>
  <text x="14" y="52"
        class="ay-word"
        font-size="54"
        fill="#F0E9DD">AYVID</text>
  <!-- Gold period — sized + positioned to look optically equal to
       a Fraunces 900 period at this scale. -->
  <circle cx="246" cy="48" r="6" fill="#C9A84C"/>
</svg>
