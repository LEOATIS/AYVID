<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" fill="none"
     role="img" aria-label="AYVID — Asymmetric Yield Via Intelligent Decisions">
  <!-- Light-theme variant — all ivory becomes warm graphite, gold stays. -->

  <g transform="translate(4, 8) scale(0.467)">
    <line x1="35.3" y1="92" x2="60" y2="16" stroke="#0F0D0A" stroke-width="6"/>
    <line x1="84.7" y1="92" x2="60" y2="16" stroke="#0F0D0A" stroke-width="6"/>
    <line x1="44.7" y1="63" x2="75.3" y2="63" stroke="#0F0D0A" stroke-width="4"/>
    <circle cx="35.3" cy="92" r="4"   fill="#0F0D0A"/>
    <circle cx="84.7" cy="92" r="4"   fill="#0F0D0A"/>
    <circle cx="44.7" cy="63" r="2.8" fill="#0F0D0A"/>
    <circle cx="75.3" cy="63" r="2.8" fill="#0F0D0A"/>
    <circle cx="60"   cy="16" r="5"   fill="#C9A84C"/>
