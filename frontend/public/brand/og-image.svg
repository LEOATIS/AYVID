<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Warm graphite background — matches the brand contract. -->
  <rect width="1200" height="630" fill="#0F0D0A"/>

  <!-- Subtle noise overlay (mix-blend-mode: overlay).
       The opacity is intentionally tiny — eyes shouldn't see noise,
       only feel that the page is less digital. -->
  <rect width="1200" height="630" fill="#F0E9DD" opacity="0.018"
        style="mix-blend-mode: overlay"/>

  <!-- Mark large, left.  Scale 2.4× from base 120-unit grid. -->
  <g transform="translate(96, 180) scale(2.4)">
    <line x1="35.3" y1="92" x2="60" y2="16" stroke="#F0E9DD" stroke-width="6"/>
    <line x1="84.7" y1="92" x2="60" y2="16" stroke="#F0E9DD" stroke-width="6"/>
    <line x1="44.7" y1="63" x2="75.3" y2="63" stroke="#F0E9DD" stroke-width="4"/>
    <circle cx="35.3" cy="92" r="4"   fill="#F0E9DD"/>
    <circle cx="84.7" cy="92" r="4"   fill="#F0E9DD"/>
    <circle cx="44.7" cy="63" r="2.8" fill="#F0E9DD"/>
    <circle cx="75.3" cy="63" r="2.8" fill="#F0E9DD"/>
    <circle cx="60"   cy="16" r="5"   fill="#C9A84C"/>
  </g>

  <!-- Vertical hairline divider. -->
  <line x1="480" y1="180" x2="480" y2="450"
        stroke="#F0E9DD" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Wordmark — Fraunces 900, big and editorial. -->
  <text x="528" y="288"
        font-family="Fraunces, Georgia, serif"
        font-weight="900" font-size="112" letter-spacing="-4.5"
        fill="#F0E9DD"
        style="font-variation-settings: 'opsz' 144, 'SOFT' 30;">AYVID</text>

  <!-- Tagline — editorial small caps, mono, wide tracking. -->
  <text x="532" y="324"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-weight="500" font-size="14" letter-spacing="4"
        fill="#F0E9DD" fill-opacity="0.48">
    ASYMMETRIC YIELD VIA INTELLIGENT DECISIONS
  </text>

  <!-- Single gold hairline beneath the wordmark — the watermark touch. -->
  <line x1="528" y1="360" x2="900" y2="360"
        stroke="#C9A84C" stroke-opacity="0.30" stroke-width="1"/>

  <!-- Sub-label. -->
  <text x="528" y="408"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-weight="500" font-size="12" letter-spacing="2.4"
        fill="#F0E9DD" fill-opacity="0.36">AN AI-NATIVE HEDGE FUND</text>
</svg>
