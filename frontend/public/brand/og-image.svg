<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,900&amp;family=JetBrains+Mono:wght@500&amp;display=block");
      .ay-word {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-variation-settings: "opsz" 144, "SOFT" 30;
        letter-spacing: -0.045em;
      }
      .ay-tag {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Warm graphite background — matches the brand palette. -->
  <rect width="1200" height="630" fill="#0F0D0A"/>

  <!-- Top eyebrow — small caps mono, dim, left-aligned. -->
  <text x="96" y="148"
        class="ay-tag"
        font-size="18"
        letter-spacing="5"
        fill="#C9A84C"
        fill-opacity="0.80">AYVID</text>

  <!-- The wordmark — huge, considered, the only thing on the page. -->
  <text x="96" y="346"
        class="ay-word"
        font-size="220"
        fill="#F0E9DD">AYVID</text>
  <!-- Gold full-stop — the brand's only ornament. -->
  <circle cx="744" cy="328" r="22" fill="#C9A84C"/>

  <!-- Gold hairline rule — currency watermark, single permitted line. -->
  <line x1="96" y1="406" x2="640" y2="406"
        stroke="#C9A84C" stroke-opacity="0.42" stroke-width="1"/>

  <!-- Tagline as editorial small-caps band, narrow tracking. -->
  <text x="96" y="450"
        class="ay-tag"
        font-size="18"
        letter-spacing="5"
        fill="#F0E9DD"
        fill-opacity="0.62">ASYMMETRIC YIELD VIA INTELLIGENT DECISIONS</text>

  <!-- Sub-label.  Two tonal weights of the same mono. -->
  <text x="96" y="498"
        class="ay-tag"
        font-size="16"
        letter-spacing="3.6"
        fill="#F0E9DD"
        fill-opacity="0.36">AN AI-NATIVE HEDGE FUND</text>
</svg>
