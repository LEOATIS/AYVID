<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Favicon — the "A." monogram at 32px.  Favicon contexts (browser
       tab renderers, OS bookmark indexes) often skip @import in SVG,
       so we set font-family to a stack with Georgia as the immediate
       fallback.  Georgia renders a serviceable heavy A; not as
       beautiful as Fraunces but unmistakably the same letter. -->
  <text x="14" y="25"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-weight="900"
        font-size="30"
        fill="#F0E9DD"
        text-anchor="middle">A</text>
  <circle cx="25" cy="24" r="2.4" fill="#C9A84C"/>
</svg>
