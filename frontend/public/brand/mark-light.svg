<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none"
     role="img" aria-label="AYVID">
  <!-- Light-theme variant — the A renders in warm graphite (#0F0D0A)
       on warm cream paper.  Gold period unchanged. -->
  <defs>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,900&amp;display=block");
      .ay-mark {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-variation-settings: "opsz" 144, "SOFT" 30;
        letter-spacing: -0.045em;
      }
    </style>
  </defs>
  <text x="60" y="92"
        class="ay-mark"
        font-size="108"
        fill="#0F0D0A"
        text-anchor="middle">A</text>
  <circle cx="92" cy="88" r="8" fill="#C9A84C"/>
</svg>
