<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none"
     role="img" aria-label="AYVID mark">
  <!-- Light-theme variant — strokes become warm graphite (#0F0D0A).
       Apex stays gold. -->

  <!-- Left leg -->
  <line x1="35.3" y1="92" x2="60" y2="16"
        stroke="#0F0D0A" stroke-width="6"/>
  <!-- Right leg -->
  <line x1="84.7" y1="92" x2="60" y2="16"
        stroke="#0F0D0A" stroke-width="6"/>
  <!-- Crossbar at golden ratio -->
  <line x1="44.7" y1="63" x2="75.3" y2="63"
        stroke="#0F0D0A" stroke-width="4"/>

  <!-- Four graph nodes in warm graphite -->
  <circle cx="35.3" cy="92" r="4"   fill="#0F0D0A"/>
  <circle cx="84.7" cy="92" r="4"   fill="#0F0D0A"/>
  <circle cx="44.7" cy="63" r="2.8" fill="#0F0D0A"/>
  <circle cx="75.3" cy="63" r="2.8" fill="#0F0D0A"/>

  <!-- Apex node — gold stays gold regardless of theme. -->
  <circle cx="60" cy="16" r="5" fill="#C9A84C"/>
</svg>
