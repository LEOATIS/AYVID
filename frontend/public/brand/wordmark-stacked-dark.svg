<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none"
     role="img" aria-label="AYVID — An AI-Native Hedge Fund">
  <!-- Stacked lockup — used on the gate and hero contexts where there's
       vertical room for the tagline as a separate typographic moment.
       Wordmark on top, gold-hairline rule, tagline below. -->
  <defs>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,900&amp;family=JetBrains+Mono:wght@500&amp;display=block");
      .ay-word {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-variation-settings: "opsz" 144, "SOFT" 30;
        letter-spacing: -0.04em;
      }
      .ay-tag {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-weight: 500;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>

  <!-- Wordmark, centred. -->
  <text x="160" y="80"
        class="ay-word"
        font-size="68"
        fill="#F0E9DD"
        text-anchor="middle">AYVID</text>
  <!-- Gold period after the AYVID block — offset to align with what
       a Fraunces 900 full-stop would do at this size. -->
  <circle cx="252" cy="74" r="7" fill="#C9A84C"/>

  <!-- Gold hairline rule — currency watermark register, the brand's
       single permitted ornament. -->
  <line x1="80" y1="106" x2="240" y2="106"
        stroke="#C9A84C" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Tagline as a discrete element below — wide tracking, mono, dimmed.
       This is the ONE place the tagline lives in the lockup itself. -->
  <text x="160" y="132"
        class="ay-tag"
        font-size="10"
        fill="#F0E9DD"
        fill-opacity="0.50"
        text-anchor="middle">AN AI-NATIVE HEDGE FUND</text>
</svg>
